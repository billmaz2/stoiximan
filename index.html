<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        th:hover {
            background-color: #e6e6e6;
        }
        .result--1 { background-color: white; }
        .result-1 { background-color: green; color: white; }
        .result-X { background-color: yellow; }
        .result-2 { background-color: red; color: white; }
        .filter-section {
            margin-bottom: 20px;
        }
        select, button {
            padding: 8px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Games Data</h1>

    <div class="filter-section">
        <label for="championshipFilter">Filter by Championship:</label>
        <select id="championshipFilter">
            <option value="">All Championships</option>
        </select>
        <button onclick="applyFilter()">Apply Filter</button>
    </div>

    <div id="loading">Loading data...</div>
    <table id="gamesTable">
        <thead id="tableHeader"></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // Your GitHub Pages URL
        const baseUrl = "https://billmaz2.github.io/stoiximan/";

        // List of JSON files to load
        const jsonFiles = [
            "total_1.json",
            "total_2.json",
            "total_3.json",
            "total_4.json",
            "total_260905.json"
        ];

        // Global variables
        let allGames = [];
        let filteredGames = [];
        let currentSortColumn = null;
        let currentSortDirection = 1; // 1 for ascending, -1 for descending
        let championships = [];

        // Load all JSON files
        async function loadData() {
            try {
                const responses = await Promise.all(
                    jsonFiles.map(file => fetch(baseUrl + file))
                );
                const jsonData = await Promise.all(
                    responses.map(res => res.json())
                );
                allGames = jsonData.flat();
                filteredGames = [...allGames];

                // Extract unique championships
                championships = [...new Set(allGames.map(game => game.championship).filter(Boolean))].sort();
                populateChampionshipFilter();

                renderTable();
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById("loading").textContent = "Failed to load data. Check the console for details.";
            }
        }

        // Populate championship dropdown
        function populateChampionshipFilter() {
            const filterDropdown = document.getElementById("championshipFilter");
            championships.forEach(championship => {
                const option = document.createElement("option");
                option.value = championship;
                option.textContent = championship;
                filterDropdown.appendChild(option);
            });
        }

        // Apply championship filter
        function applyFilter() {
            const selectedChampionship = document.getElementById("championshipFilter").value;
            if (selectedChampionship === "") {
                filteredGames = [...allGames];
            } else {
                filteredGames = allGames.filter(game => game.championship === selectedChampionship);
            }
            renderTable();
        }

        // Render the table
        function renderTable() {
            if (filteredGames.length === 0) {
                document.getElementById("loading").textContent = "No data to display.";
                return;
            }

            // Get column names from the first game object
            const columns = Object.keys(filteredGames[0]);

            // Render table header
            const header = document.getElementById("tableHeader");
            header.innerHTML = columns.map(col => `
                <th onclick="sortTable('${col}')">
                    ${col} ${currentSortColumn === col ? (currentSortDirection === 1 ? '↑' : '↓') : ''}
                </th>
            `).join("");

            // Render table body
            const body = document.getElementById("tableBody");
            body.innerHTML = filteredGames.map(game => {
                const result = game.result;
                const resultClass = result === -1 ? "result--1" :
                                   result === 1 ? "result-1" :
                                   result === "X" ? "result-X" : "result-2";
                return `<tr class="${resultClass}">
                    ${columns.map(col => `<td>${game[col]}</td>`).join("")}
                </tr>`;
            }).join("");

            document.getElementById("loading").style.display = "none";
        }

        // Sort table by column
        function sortTable(column) {
            if (currentSortColumn === column) {
                currentSortDirection *= -1; // Toggle direction
            } else {
                currentSortColumn = column;
                currentSortDirection = 1;
            }

            filteredGames.sort((a, b) => {
                const valA = a[column];
                const valB = b[column];
                if (valA < valB) return -1 * currentSortDirection;
                if (valA > valB) return 1 * currentSortDirection;
                return 0;
            });

            renderTable();
        }

        // Load data on page load
        window.onload = loadData;
    </script>
</body>
</html>
