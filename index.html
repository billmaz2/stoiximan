<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th:hover {
            background-color: #e6e6e6;
        }
        .result--1 { background-color: white; }
        .result-1 { background-color: green; color: white; }
        .result-X { background-color: yellow; }
        .result-2 { background-color: red; color: white; }
        .filter-section {
            margin-bottom: 20px;
        }
        select, button {
            padding: 8px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            position: relative;
        }
        #progressBar {
            width: 300px;
            height: 20px;
            background: #f3f3f3;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        #progressFill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            margin: 10px 0;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .pagination {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 5px 12px;
        }
        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .page-info {
            margin: 0 10px;
        }
        .error {
            color: red;
            padding: 20px;
            background: #ffeeee;
            border: 1px solid red;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="loadingContainer" class="loading-container">
        <div class="spinner"></div>
        <div id="loadingText">Loading data...</div>
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
        <div id="loadingDetail">Initializing...</div>
    </div>

    <h1>Games Data Viewer</h1>

    <div class="stats" id="stats">
        <span id="totalRecords">Loading...</span>
    </div>

    <div class="filter-section">
        <label for="championshipFilter">Filter by Championship:</label>
        <select id="championshipFilter">
            <option value="">All Championships</option>
        </select>
        <button onclick="applyFilter()">Apply Filter</button>
        <button onclick="resetFilter()" style="background-color: #f44336;">Reset</button>
    </div>

    <div class="table-container" id="tableContainer">
        <table id="gamesTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination">
        <button onclick="changePage(-1)" id="prevPage">Previous</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button onclick="changePage(1)" id="nextPage">Next</button>
        <span style="margin-left: 20px;">
            Items per page:
            <select id="pageSize" onchange="changePageSize()">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="500">500</option>
            </select>
        </span>
    </div>

    <script>
        // Your GitHub Pages URL
        const baseUrl = "https://billmaz2.github.io/stoiximan/";

        // List of JSON files to load
        const jsonFiles = [
            "total_1.json",
            "total_2.json",
            "total_3.json",
            "total_4.json",
            "total_260905.json"
        ];

        // Global variables
        let allGames = [];
        let filteredGames = [];
        let currentSortColumn = null;
        let currentSortDirection = 1;
        let championships = [];
        let currentPage = 1;
        let pageSize = 100;
        let isLoading = false;

        // DOM elements
        const loadingContainer = document.getElementById('loadingContainer');
        const loadingText = document.getElementById('loadingText');
        const loadingDetail = document.getElementById('loadingDetail');
        const progressFill = document.getElementById('progressFill');
        const tableBody = document.getElementById('tableBody');
        const tableHeader = document.getElementById('tableHeader');
        const stats = document.getElementById('stats');
        const totalRecords = document.getElementById('totalRecords');

        // Load all JSON files with progress
        async function loadData() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                allGames = [];
                let loadedCount = 0;
                const totalFiles = jsonFiles.length;

                // Load first file immediately
                loadingText.textContent = 'Loading initial data...';
                loadingDetail.textContent = `Loading file 1 of ${totalFiles}`;
                progressFill.style.width = '10%';

                const firstResponse = await fetch(baseUrl + jsonFiles[0]);
                const firstData = await firstResponse.json();
                allGames = firstData;
                loadedCount++;
                
                // Show initial data immediately
                filteredGames = [...allGames];
                championships = [...new Set(allGames.map(game => game.championship).filter(Boolean))].sort();
                populateChampionshipFilter();
                renderTable();
                updateStats();
                
                loadingText.textContent = 'Loading additional data...';
                progressFill.style.width = '20%';

                // Load remaining files one by one
                for (let i = 1; i < totalFiles; i++) {
                    loadingDetail.textContent = `Loading file ${i+1} of ${totalFiles}`;
                    
                    const response = await fetch(baseUrl + jsonFiles[i]);
                    const data = await response.json();
                    allGames = allGames.concat(data);
                    loadedCount++;
                    
                    // Update progress
                    const progress = 20 + (i / totalFiles) * 70;
                    progressFill.style.width = progress + '%';
                    
                    // Update filtered data if no filter is active
                    const selectedChampionship = document.getElementById('championshipFilter').value;
                    if (selectedChampionship === '') {
                        filteredGames = [...allGames];
                    } else {
                        filteredGames = allGames.filter(game => game.championship === selectedChampionship);
                    }
                    
                    // Re-render with new data
                    renderTable();
                    updateStats();
                    
                    // Update championships if needed
                    const newChampionships = [...new Set(allGames.map(game => game.championship).filter(Boolean))].sort();
                    if (newChampionships.length > championships.length) {
                        championships = newChampionships;
                        populateChampionshipFilter();
                    }
                }

                // Final update
                progressFill.style.width = '100%';
                loadingText.textContent = 'Complete!';
                loadingDetail.textContent = `Loaded ${allGames.length} records from ${totalFiles} files`;
                
                // Hide loading screen after a short delay
                setTimeout(() => {
                    loadingContainer.style.display = 'none';
                }, 500);

            } catch (error) {
                console.error("Error loading data:", error);
                loadingText.textContent = '❌ Error loading data';
                loadingDetail.textContent = 'Please check console for details';
                document.getElementById('loadingContainer').innerHTML = `
                    <div class="error">
                        <h3>Failed to load data</h3>
                        <p>${error.message}</p>
                        <button onclick="location.reload()">Retry</button>
                    </div>
                `;
            } finally {
                isLoading = false;
            }
        }

        // Populate championship dropdown
        function populateChampionshipFilter() {
            const filterDropdown = document.getElementById('championshipFilter');
            const currentValue = filterDropdown.value;
            
            // Clear existing options except first
            while (filterDropdown.options.length > 1) {
                filterDropdown.remove(1);
            }
            
            championships.forEach(championship => {
                const option = document.createElement('option');
                option.value = championship;
                option.textContent = championship;
                filterDropdown.appendChild(option);
            });
            
            // Restore selected value if it exists
            if (currentValue && championships.includes(currentValue)) {
                filterDropdown.value = currentValue;
            }
        }

        // Apply championship filter
        function applyFilter() {
            const selectedChampionship = document.getElementById('championshipFilter').value;
            if (selectedChampionship === '') {
                filteredGames = [...allGames];
            } else {
                filteredGames = allGames.filter(game => game.championship === selectedChampionship);
            }
            currentPage = 1;
            renderTable();
            updateStats();
        }

        // Reset filter
        function resetFilter() {
            document.getElementById('championshipFilter').value = '';
            filteredGames = [...allGames];
            currentPage = 1;
            renderTable();
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const total = filteredGames.length;
            const totalAll = allGames.length;
            totalRecords.textContent = `Showing ${total} of ${totalAll} records${filteredGames.length !== allGames.length ? ' (filtered)' : ''}`;
        }

        // Render the table with pagination
        function renderTable() {
            if (filteredGames.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100" style="text-align:center;">No data to display</td></tr>';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            document.getElementById('pagination').style.display = 'flex';

            // Get column names from the first game object
            const columns = Object.keys(filteredGames[0]);

            // Render table header
            tableHeader.innerHTML = columns.map(col => `
                <th onclick="sortTable('${col}')" style="white-space: nowrap;">
                    ${col} ${currentSortColumn === col ? (currentSortDirection === 1 ? '↑' : '↓') : ''}
                </th>
            `).join('');

            // Calculate pagination
            const totalPages = Math.ceil(filteredGames.length / pageSize);
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, filteredGames.length);
            const pageData = filteredGames.slice(startIndex, endIndex);

            // Update pagination controls
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;

            // Render table body using DocumentFragment for performance
            const fragment = document.createDocumentFragment();
            
            pageData.forEach(game => {
                const tr = document.createElement('tr');
                const result = game.result;
                const resultClass = result === -1 ? 'result--1' :
                                   result === 1 ? 'result-1' :
                                   result === 'X' ? 'result-X' : 'result-2';
                tr.className = resultClass;
                
                columns.forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = game[col] !== undefined ? game[col] : '';
                    tr.appendChild(td);
                });
                
                fragment.appendChild(tr);
            });

            // Clear and append new rows
            tableBody.innerHTML = '';
            tableBody.appendChild(fragment);
        }

        // Sort table by column
        function sortTable(column) {
            if (currentSortColumn === column) {
                currentSortDirection *= -1;
            } else {
                currentSortColumn = column;
                currentSortDirection = 1;
            }

            filteredGames.sort((a, b) => {
                const valA = a[column];
                const valB = b[column];
                if (valA < valB) return -1 * currentSortDirection;
                if (valA > valB) return 1 * currentSortDirection;
                return 0;
            });

            currentPage = 1;
            renderTable();
        }

        // Change page
        function changePage(delta) {
            const totalPages = Math.ceil(filteredGames.length / pageSize);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
                // Scroll to top of table
                document.getElementById('tableContainer').scrollTop = 0;
            }
        }

        // Change page size
        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            currentPage = 1;
            renderTable();
        }

        // Load data on page load
        window.onload = loadData;
    </script>
</body>
</html>
